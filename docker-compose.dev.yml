# ── MODO DESARROLLO (solo en tu máquina, nunca en el servidor) ──────────────
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Se monta encima del docker-compose.yml de producción y solo cambia lo de PHP:
# php.dev.ini (errores en pantalla, OPcache revisando cambios, Xdebug) e imágenes
# construidas con Xdebug. Entra por:
#   web → http://natalia.localhost:${NGINX_PORT}
#   api → http://api.natalia.localhost:${NGINX_PORT}
x-dev: &dev
  build:
    args:
      INSTALL_XDEBUG: "true"
  extra_hosts:
    - "host.docker.internal:host-gateway"   # Xdebug → PhpStorm en tu máquina

services:
  api:
    <<: *dev
    volumes:
      - ./docker-config/php/api/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro

  web:
    <<: *dev
    volumes:
      - ./docker-config/php/web/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
