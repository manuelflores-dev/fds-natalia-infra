; === WEB — configuración de producción ===
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2          ; los errores salen por docker logs
expose_php = Off

memory_limit = 256M
max_execution_time = 120

; Fotos de pasteles / subidas desde Livewire
upload_max_filesize = 32M
post_max_size = 32M

date.timezone = America/Mexico_City
cgi.fix_pathinfo = 0

session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
