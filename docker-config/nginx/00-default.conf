# ── Catch-all ───────────────────────────────────────────────────────────────
# Cualquier petición con un Host que no sea uno de los dominios configurados
# se corta aquí (evita que un dominio ajeno apuntado a este servidor entre a
# alguno de los proyectos). Se carga primero por el 00- del nombre.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
